<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FÆ CITY — Gate Open</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      font-family: 'Space Grotesk', sans-serif;
      background: #04080f;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
      );
    }

    /* Background */
    .bg { position: fixed; inset: 0; z-index: 0; }
    .bg img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
      opacity: 0.22; display: block;
    }
    .bg-scrim {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(4,8,15,0.2) 0%, rgba(4,8,15,0.88) 100%);
    }

    .nameplate {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      text-align: center; padding: 6px 0 7px;
      background: linear-gradient(90deg,#7a5010 0%,#c8a030 12%,#f0d050 30%,#e8c84b 50%,#f0d050 70%,#c8a030 88%,#7a5010 100%);
      font-family: 'Space Mono', monospace; font-size: 12px; font-weight: bold;
      letter-spacing: 0.5em; color: #1a0a00; border-bottom: 2px solid #a07820;
    }

    /* Page */
    .page {
      position: relative; z-index: 10;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px; text-align: center;
      gap: 0;
    }

    /* Gate open animation */
    .gate-wrap {
      position: relative;
      width: 200px; height: 200px;
      margin-bottom: 44px;
    }

    /* Outer glow ring */
    .gate-glow {
      position: absolute; inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,168,75,0.2) 0%, transparent 70%);
      animation: glowPulse 2s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%,100% { opacity: 0.5; transform: scale(0.95); }
      50%      { opacity: 1;   transform: scale(1.08); }
    }

    /* Gate rings */
    .gate-ring {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(200,168,75,0.3);
      animation: ringOpen 3s ease-out both;
    }
    .gate-ring:nth-child(2) { inset: 0;    animation-delay: 0s;    border-color: rgba(200,168,75,0.5); border-width: 2px; }
    .gate-ring:nth-child(3) { inset: 20px; animation-delay: 0.15s; }
    .gate-ring:nth-child(4) { inset: 40px; animation-delay: 0.3s;  }
    @keyframes ringOpen {
      0%   { opacity: 0; transform: scale(0.4) rotate(-180deg); }
      60%  { opacity: 1; }
      100% { opacity: 0.8; transform: scale(1) rotate(0deg); }
    }

    /* Zenvarion */
    .zenvarion-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .zenvarion-img {
      width: 120px; height: 120px;
      object-fit: contain;
      animation: zenFloat 3s ease-in-out infinite, zenAppear 0.8s 0.3s ease both;
      filter: drop-shadow(0 0 20px rgba(200,168,75,0.7))
              drop-shadow(0 0 40px rgba(200,168,75,0.3));
    }
    @keyframes zenAppear {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes zenFloat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    /* Star burst */
    .star-burst {
      position: absolute; inset: 0;
      animation: starSpin 8s linear infinite;
    }
    .star-burst::before, .star-burst::after {
      content: '✦';
      position: absolute; font-size: 18px; color: rgba(200,168,75,0.6);
    }
    .star-burst::before { top: 0; left: 50%; transform: translateX(-50%); }
    .star-burst::after  { bottom: 0; left: 50%; transform: translateX(-50%); }
    @keyframes starSpin { to { transform: rotate(360deg); } }

    /* Text */
    .cleared-eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase;
      color: #4acc70; margin-bottom: 16px;
      animation: fadeUp 0.7s 0.5s ease both; opacity: 0;
    }
    .cleared-title {
      font-family: 'Playfair Display', serif;
      font-size: 3rem; font-weight: 700;
      color: #c8a84b; line-height: 1;
      margin-bottom: 12px;
      animation: fadeUp 0.7s 0.65s ease both; opacity: 0;
    }
    .cleared-sub {
      font-family: 'Playfair Display', serif;
      font-style: italic; font-size: 1.15rem;
      color: rgba(232,216,176,0.75);
      line-height: 1.6; margin-bottom: 36px;
      animation: fadeUp 0.7s 0.8s ease both; opacity: 0;
    }

    /* Enter button */
    .enter-btn {
      padding: 18px 44px;
      background: linear-gradient(135deg, #c8a84b, #e8c84b);
      color: #1a0e00; border: none; border-radius: 50px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      animation: fadeUp 0.7s 1s ease both; opacity: 0;
      box-shadow: 0 0 32px rgba(200,168,75,0.35);
    }
    .enter-btn:hover { opacity: 0.9; transform: scale(1.02); }
    .enter-btn:active { transform: scale(0.98); }

    .auto-note {
      font-family: 'Space Mono', monospace;
      font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(200,190,170,0.3); margin-top: 16px;
      animation: fadeUp 0.7s 1.2s ease both; opacity: 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .cleared-title { font-size: 2.2rem; }
      .gate-wrap { width: 160px; height: 160px; }
      .zenvarion-img { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>

<div class="bg">
  <img src="/house.jpg" alt="" draggable="false">
  <div class="bg-scrim"></div>
</div>

<div class="nameplate">FÆ CITY™ — GATE OPEN</div>

<div class="page">

  <div class="gate-wrap">
    <div class="gate-glow"></div>
    <div class="gate-ring"></div>
    <div class="gate-ring"></div>
    <div class="gate-ring"></div>
    <div class="star-burst"></div>
    <div class="zenvarion-wrap">
      <img class="zenvarion-img" src="/zenvarion.png" alt="Zenvarion">
    </div>
  </div>

  <div class="cleared-eyebrow">✦ &nbsp; Gate Disposition: PERMIT &nbsp; ✦</div>
  <h1 class="cleared-title">You May Enter.</h1>
  <p class="cleared-sub">
    The covenant is sealed.<br>
    FÆ CITY receives you.
  </p>

  <button class="enter-btn" onclick="enter()">Enter FÆ CITY &nbsp;✦</button>
  <div class="auto-note" id="autoNote">Entering automatically in <span id="countdown">8</span>s</div>

</div>

<script>
let t = 8;
const countdownEl = document.getElementById('countdown');
const timer = setInterval(() => {
  t--;
  countdownEl.textContent = t;
  if (t <= 0) { clearInterval(timer); enter(); }
}, 1000);

function enter() {
  clearInterval(timer);
  window.location.replace('/house');
}
</script>

</body>
</html>
