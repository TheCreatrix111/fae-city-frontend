<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FÆ CITY — Guardian Mesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      font-family: 'Inter', sans-serif;
      background: #e8ecf5;
      overflow: hidden;
    }

    /* ── Background ──────────────────────────────────────────────────────────── */
    .bg-layer { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
    .bg-circle { position:absolute; border-radius:50%; background:rgba(255,255,255,0.55); }
    .bg-circle.c1 { width:360px; height:360px; top:-100px; left:-80px; }
    .bg-circle.c2 { width:220px; height:220px; top:40px; right:-60px; opacity:.5; }
    .bg-circle.c3 { width:280px; height:280px; bottom:-80px; left:32%; opacity:.4; }
    .bg-circle.c4 { width:160px; height:160px; bottom:60px; right:8%; opacity:.35; }
    .bg-circle.c5 { width:120px; height:120px; top:45%; left:22%; opacity:.3; }

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    .layout {
      position:relative; z-index:1;
      display:grid;
      grid-template-columns: 380px 1fr 380px;
      grid-template-rows: 56px 1fr;
      height:100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    .header {
      grid-column: 1 / -1;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 20px;
      background:#e8ecf5;
      box-shadow:0 4px 14px rgba(163,185,230,0.45), 0 -1px 4px rgba(255,255,255,0.9);
      position:relative; z-index:10;
    }
    .header-left  { display:flex; align-items:center; gap:10px; }
    .header-logo  {
      width:32px; height:32px; border-radius:50%;
      background:linear-gradient(135deg,#6366f1,#a78bfa,#60a5fa);
      box-shadow:4px 4px 8px rgba(163,185,230,0.7),-2px -2px 6px rgba(255,255,255,0.9);
      display:flex; align-items:center; justify-content:center;
    }
    .header-logo-inner { width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,0.3); }
    .header-titles { display:flex; flex-direction:column; gap:1px; }
    .header-title { font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; color:#3b4a6b; }
    .header-sub   { font-size:9px; color:#8a9bc0; letter-spacing:.04em; }

    .header-right { display:flex; align-items:center; gap:10px; }
    .stat-pill {
      display:flex; align-items:center; gap:5px;
      padding:4px 11px; border-radius:20px; background:#e8ecf5;
      box-shadow:3px 3px 7px rgba(163,185,230,0.55),-2px -2px 5px rgba(255,255,255,0.9);
      font-size:10px; color:#8a9bc0;
    }
    .stat-val { font-weight:700; color:#3b4a6b; font-size:11px; }
    .stream-status { display:flex; align-items:center; gap:6px; font-size:10px; color:#8a9bc0; }
    .stream-dot { width:7px; height:7px; border-radius:50%; background:#c0c8da; transition:background .4s,box-shadow .4s; }
    .stream-dot.live  { background:#34d399; box-shadow:0 0 7px #34d39988; }
    .stream-dot.error { background:#f87171; }

    /* ── Shared panel base ───────────────────────────────────────────────────── */
    .side-panel {
      display:flex; flex-direction:column;
      padding:14px 14px 12px;
      overflow:hidden;
    }
    .panel-label {
      font-size:9px; font-weight:700; letter-spacing:.14em;
      color:#8a9bc0; text-transform:uppercase;
      padding:0 8px; margin-bottom:8px;
    }
    .card-list {
      flex:1; overflow-y:auto;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:7px;
      align-content:start;
      scrollbar-width:thin; scrollbar-color:#c5cee0 transparent;
    }
    .card-list::-webkit-scrollbar { width:3px; }
    .card-list::-webkit-scrollbar-thumb { background:#c5cee0; border-radius:3px; }

    /* ── Agent / Threat cards ────────────────────────────────────────────────── */
    .agent-card, .threat-card {
      display:flex; flex-direction:column; align-items:center; gap:7px;
      padding:12px 10px 10px; border-radius:16px; margin-bottom:0;
      background:#e8ecf5;
      box-shadow:4px 4px 9px rgba(163,185,230,0.5),-3px -3px 7px rgba(255,255,255,0.95);
      cursor:pointer; transition:box-shadow .2s;
    }
    .agent-card:hover, .threat-card:hover {
      box-shadow:3px 3px 6px rgba(163,185,230,0.4),-2px -2px 5px rgba(255,255,255,0.9);
    }
    .agent-card.active {
      box-shadow:inset 3px 3px 7px rgba(163,185,230,0.5),inset -2px -2px 5px rgba(255,255,255,0.8);
    }

    /* ── Orb ─────────────────────────────────────────────────────────────────── */
    .orb-wrap {
      position:relative; width:52px; height:52px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      border-radius:50%; background:#e8ecf5;
      box-shadow:4px 4px 8px rgba(163,185,230,0.5),-3px -3px 6px rgba(255,255,255,0.9);
    }
    .orb-blob {
      width:44px; height:44px; border-radius:50%;
      filter:blur(6px) saturate(1.2);
      position:absolute; transition:filter .4s;
    }
    /* agent face: friendly pill */
    .orb-face {
      position:relative; z-index:2;
      width:20px; height:9px; border-radius:20px;
      background:rgba(15,15,40,0.75);
      box-shadow:-6px 0 0 2.5px rgba(255,255,255,0.93), 6px 0 0 2.5px rgba(255,255,255,0.93);
      transition:background .3s;
    }
    /* threat face: angular, red-tinted eyes */
    .orb-face.threat {
      border-radius:5px;
      background:rgba(60,10,10,0.82);
      box-shadow:-6px -1px 0 2.5px rgba(255,180,180,0.95), 6px -1px 0 2.5px rgba(255,180,180,0.95);
    }

    /* state glow */
    .orb-wrap.state-INTERCEPTING .orb-blob { filter:blur(4px) saturate(2.2) brightness(1.15); }
    .orb-wrap.state-QUARANTINE   .orb-blob { filter:blur(4px) saturate(2.0) brightness(1.1); }
    .orb-wrap.state-ALERT        .orb-blob { filter:blur(5px) saturate(1.9); }
    .orb-wrap.state-INTERCEPTING .orb-face { background:rgba(88,28,220,0.8); }
    .orb-wrap.state-QUARANTINE   .orb-face { background:rgba(185,28,28,0.8); }

    /* threat active state */
    .orb-wrap.threat-ACTIVE  .orb-blob { filter:blur(4px) saturate(2.5) brightness(1.2); }
    .orb-wrap.threat-BLOCKED .orb-blob { filter:blur(7px) saturate(0.6) brightness(0.85); }

    @keyframes orb-pulse {
      0%   { box-shadow:3px 3px 6px rgba(163,185,230,0.5),-2px -2px 5px rgba(255,255,255,0.9),0 0 0 0 var(--pulse-color); }
      60%  { box-shadow:3px 3px 6px rgba(163,185,230,0.5),-2px -2px 5px rgba(255,255,255,0.9),0 0 0 9px transparent; }
      100% { box-shadow:3px 3px 6px rgba(163,185,230,0.5),-2px -2px 5px rgba(255,255,255,0.9),0 0 0 0 transparent; }
    }
    .orb-wrap.pulsing { animation:orb-pulse 0.7s ease-out; }

    /* ── Card text ───────────────────────────────────────────────────────────── */
    .card-info  { width:100%; text-align:center; min-width:0; }
    .card-name  { font-size:11px; font-weight:600; color:#3b4a6b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-sub   { font-size:9px; color:#8a9bc0; margin-top:1px; }
    .card-chat {
      font-size:9px; color:#7a8db0; margin-top:4px;
      font-style:italic; line-height:1.3; text-align:center;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
      transition:color .3s;
    }
    .card-chat::before { content:'"'; opacity:0.5; }
    .card-chat::after  { content:'"'; opacity:0.5; }
    .card-chat.threat-active  { color:#ef4444; font-style:normal; font-weight:500; }
    .card-chat.threat-active::before, .card-chat.threat-active::after { content:''; }
    .card-chat.threat-blocked { color:#34d399; font-style:normal; font-weight:500; }
    .card-chat.threat-blocked::before, .card-chat.threat-blocked::after { content:''; }

    .card-meta  { display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex-shrink:0; }
    .state-chip {
      font-size:8px; font-weight:700; letter-spacing:.05em;
      padding:2px 6px; border-radius:8px; text-transform:uppercase; white-space:nowrap;
    }
    /* guardian chips */
    .chip-NOMINAL      { background:#d1fae5; color:#065f46; }
    .chip-ALERT        { background:#fef3c7; color:#92400e; }
    .chip-INTERCEPTING { background:#ede9fe; color:#5b21b6; }
    .chip-QUARANTINE   { background:#fee2e2; color:#991b1b; }
    .chip-RECOVERING   { background:#cffafe; color:#0e7490; }
    .chip-SEALED       { background:#fef3c7; color:#92400e; }
    /* threat chips */
    .chip-IDLE    { background:#f1f5f9; color:#64748b; }
    .chip-ACTIVE  { background:#fee2e2; color:#991b1b; }
    .chip-BLOCKED { background:#d1fae5; color:#065f46; }

    .card-phi { font-size:9px; color:#a0aec0; font-family:'Space Grotesk',monospace; }

    /* ── Run Demo button ─────────────────────────────────────────────────────── */
    .replay-wrap { padding:10px 2px 0; flex-shrink:0; }
    .replay-btn {
      width:100%; padding:11px;
      border-radius:13px; border:none;
      background:linear-gradient(135deg,#6366f1,#818cf8);
      color:white; font-size:12px; font-weight:600;
      cursor:pointer; font-family:'Inter',sans-serif;
      box-shadow:4px 4px 10px rgba(99,102,241,0.4),-2px -2px 6px rgba(255,255,255,0.7);
      transition:opacity .2s, box-shadow .2s;
    }
    .replay-btn:hover:not(:disabled) { box-shadow:6px 6px 14px rgba(99,102,241,0.5),-2px -2px 6px rgba(255,255,255,0.8); }
    .replay-btn:disabled { opacity:.55; cursor:not-allowed; }
    .replay-btn.running {
      background:linear-gradient(135deg,#34d399,#10b981);
      box-shadow:4px 4px 10px rgba(52,211,153,0.4),-2px -2px 6px rgba(255,255,255,0.7);
    }

    /* ── Center column wrapper ───────────────────────────────────────────────── */
    .center-col {
      display:flex; flex-direction:column; gap:0;
      padding:12px 6px; overflow:hidden; min-width:0;
    }

    /* ── Mesh panel — neomorphic ─────────────────────────────────────────────── */
    .mesh-panel {
      position:relative; flex-shrink:0;
      height:480px;
      display:flex; align-items:center; justify-content:center;
      background:#e8ecf5;
      box-shadow:8px 8px 16px rgba(163,185,230,0.6),-5px -5px 12px rgba(255,255,255,0.95);
      border-radius:22px 22px 0 0;
      overflow:hidden;
    }
    .mesh-svg { width:100%; height:100%; max-width:520px; max-height:480px; }

    /* ── Coach Zao panel ─────────────────────────────────────────────────────── */
    .zao-panel {
      flex:1; min-height:0;
      background:#e8ecf5;
      box-shadow:8px 8px 16px rgba(163,185,230,0.6),-5px -5px 12px rgba(255,255,255,0.95);
      border-radius:0 0 22px 22px;
      border-top:1px solid rgba(163,185,230,0.2);
      padding:12px 16px;
      display:flex; flex-direction:column; gap:0; overflow:hidden;
    }
    .zao-header {
      display:flex; align-items:center; gap:10px;
      margin-bottom:10px; flex-shrink:0;
    }
    .zao-avatar {
      width:34px; height:34px; border-radius:50%; flex-shrink:0;
      background:linear-gradient(135deg,#6366f1,#a78bfa);
      box-shadow:3px 3px 7px rgba(163,185,230,0.6),-2px -2px 5px rgba(255,255,255,0.9);
      display:flex; align-items:center; justify-content:center;
      font-size:15px; line-height:1;
    }
    .zao-label {
      font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
      color:#6366f1;
    }
    /* history feed */
    .zao-feed {
      flex:1; overflow:hidden;
      display:flex; flex-direction:column; gap:5px;
    }
    .zao-feed.expanded { overflow-y:auto; }
    .zao-entry {
      font-size:10.5px; line-height:1.45; font-style:italic;
      padding:7px 10px; border-radius:10px;
      background:#e8ecf5; flex-shrink:0;
      transition:opacity .4s;
    }
    .zao-entry.current {
      color:#3b4a6b; font-weight:500; font-style:normal;
      box-shadow:3px 3px 7px rgba(163,185,230,0.5),-2px -2px 5px rgba(255,255,255,0.9);
    }
    .zao-entry.older  { color:#8a9bc0; box-shadow:inset 2px 2px 4px rgba(163,185,230,0.3),inset -1px -1px 3px rgba(255,255,255,0.7); }
    .zao-entry.oldest { color:#a8b8d0; font-size:9.5px; box-shadow:inset 2px 2px 4px rgba(163,185,230,0.2),inset -1px -1px 3px rgba(255,255,255,0.6); }
    .zao-entry.hidden { display:none; }
    .zao-see-all {
      flex-shrink:0; text-align:center; padding:6px;
      font-size:9px; font-weight:600; letter-spacing:.06em;
      color:#6366f1; cursor:pointer; text-transform:uppercase;
      transition:opacity .3s;
    }

    /* SVG */
    .mesh-edge       { stroke:rgba(99,132,196,0.3); stroke-width:1; }
    .mesh-node-ring  { fill:none; stroke-width:2; }
    .mesh-node-label { font-family:'Inter',sans-serif; font-size:9px; fill:#6a7fa8; text-anchor:middle; font-weight:600; }
    .mesh-node-phi   { font-family:'Space Grotesk',monospace; font-size:7px; fill:#9aaac0; text-anchor:middle; }
    .pulse-ring      { fill:none; stroke-width:2; opacity:0; }

    /* threat robot image */
    .threat-robot { width:40px; height:40px; object-fit:contain; position:relative; z-index:2; transition:filter .3s; mix-blend-mode:multiply; }
    .orb-wrap.threat-ACTIVE  .threat-robot { filter:drop-shadow(0 0 6px rgba(239,68,68,0.7)); }
    .orb-wrap.threat-BLOCKED .threat-robot { filter:drop-shadow(0 0 6px rgba(52,211,153,0.6)) grayscale(0.3); }

    /* threat score badge */
    .threat-score { font-size:10px; color:#ef4444; font-weight:700; }
  </style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-circle c1"></div>
  <div class="bg-circle c2"></div>
  <div class="bg-circle c3"></div>
  <div class="bg-circle c4"></div>
  <div class="bg-circle c5"></div>
</div>

<div class="layout">

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="header-logo"><div class="header-logo-inner"></div></div>
      <div class="header-titles">
        <div class="header-title">FÆ CITY</div>
        <div class="header-sub">Guardian Mesh · Live</div>
      </div>
    </div>
    <div style="position:absolute;left:50%;transform:translateX(-50%);font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#3b4a6b;letter-spacing:.18em;text-transform:uppercase;">VENTRALIS</div>
    <div class="header-right">
      <div class="stat-pill">Rate <span class="stat-val" id="statRate">—</span></div>
      <div class="stat-pill">Φ <span class="stat-val" id="statPhi">1.0000</span></div>
      <div class="stat-pill">Missed <span class="stat-val" id="statFN">0</span></div>
      <div class="stat-pill">Step <span class="stat-val" id="stepCounter">0</span></div>
      <div class="stream-status">
        <div class="stream-dot" id="streamDot"></div>
        <span id="streamLabel">connecting</span>
      </div>
    </div>
  </header>

  <!-- Left — Guardians -->
  <aside class="side-panel">
    <div class="panel-label">Guardians · 14</div>
    <div class="card-list" id="agentList"></div>
    <div class="replay-wrap">
      <button class="replay-btn" id="replayBtn"><span id="replayLabel">Run Demo</span></button>
    </div>
  </aside>

  <!-- Center — Mesh + Coach Zao -->
  <div class="center-col">
  <main class="mesh-panel">
    <svg class="mesh-svg" viewBox="-200 -200 400 400" id="meshSvg">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="edgeGroup"></g>
      <g id="ambientGroup"></g>
      <g id="spokeGroup"></g>
      <g id="sentinelGroup"></g>
      <g id="particleGroup"></g>
      <g id="pulseGroup"></g>
      <g id="nodeGroup"></g>
    </svg>
  </main>

  <!-- Coach Zao -->
  <div class="zao-panel">
    <div class="zao-header">
      <div class="zao-avatar">🧠</div>
      <div class="zao-label">Coach Zao · Live Analysis</div>
    </div>
    <div class="zao-feed expanded" id="zaoFeed">
      <div class="zao-entry current">The mesh is holding steady. All 14 guardians are online and watching. No threats in motion — yet.</div>
    </div>
    <div class="zao-see-all" id="zaoSeeAll">Collapse ↑</div>
  </div>
  </div>

  <!-- Right — Threat Actors -->
  <aside class="side-panel">
    <div class="panel-label">Threat Actors · 14</div>
    <div class="card-list" id="threatList"></div>
  </aside>

</div>

  }
  if (activity && node) {
    if (state === 'INTERCEPTING' || state === 'QUARANTINE') {

function updateThreatCard(threatType, status, targetNode) {
  const ts = threatStates[threatType];
  if (!ts) return;
  ts.status = status;
  if (targetNode) ts.lastTarget = targetNode;
  if (status === 'BLOCKED') ts.intercepts++;
  if (status === 'BREACH')  ts.breaches++;

  const orbWrap  = document.getElementById(`torb-${threatType}`);
  const chip     = document.getElementById(`tchip-${threatType}`);
  const score    = document.getElementById(`tscore-${threatType}`);
  const activity = document.getElementById(`tactivity-${threatType}`);

  if (orbWrap) {
    const cls = status === 'ACTIVE' ? 'threat-ACTIVE' : status === 'BLOCKED' ? 'threat-BLOCKED' : 'threat-IDLE';
    orbWrap.className = `orb-wrap ${cls}`;
    if (status !== 'IDLE') {
      orbWrap.classList.remove('pulsing');
      void orbWrap.offsetWidth;
      orbWrap.classList.add('pulsing');
      orbWrap.addEventListener('animationend', () => orbWrap.classList.remove('pulsing'), { once:true });
    }
  }
  const tdef = THREATS.find(t => t.id === threatType);
  const robot = document.getElementById(`trobot-${threatType}`);
  const ROBOT_IMGS = {
    IDLE:    'assets/badges/robot-nominal.png',
    ACTIVE:  'assets/badges/robot-attacking.png',
    BREACH:  'assets/badges/robot-alert.png',
    BLOCKED: 'assets/badges/robot-quarantine.png',
  };
  if (robot) robot.src = ROBOT_IMGS[status] || ROBOT_IMGS.IDLE;
  if (chip) {
    chip.className = `state-chip chip-${status === 'BREACH' ? 'ACTIVE' : status === 'BLOCKED' ? 'BLOCKED' : 'IDLE'}`;
    chip.textContent = status === 'BLOCKED' ? 'Blocked' : status === 'ACTIVE' ? 'Active' : status === 'BREACH' ? 'Breach!' : 'Idle';
  }
  if (activity && tdef) {
    if (status === 'ACTIVE' || status === 'BREACH') {
      const msgs = tdef.active;
      activity.textContent = msgs[Math.floor(Math.random() * msgs.length)];
      activity.className = 'card-chat threat-active';
    } else if (status === 'BLOCKED') {
      const msgs = tdef.blocked;
      activity.textContent = msgs[Math.floor(Math.random() * msgs.length)];
      activity.className = 'card-chat threat-blocked';
    } else {
      activity.className = 'card-chat';
    }
  }

  // auto-reset to idle after 3s
  if (status !== 'IDLE') {
    setTimeout(() => {
      if (threatStates[threatType].status === status) {
        threatStates[threatType].status = 'IDLE';
        updateThreatCard(threatType, 'IDLE', null);
      }
    }, 3000);
  }
}

// ── SVG Mesh ──────────────────────────────────────────────────────────────────
function buildMesh() {
  const edgeG  = document.getElementById('edgeGroup');
  const nodeG  = document.getElementById('nodeGroup');
  const pulseG = document.getElementById('pulseGroup');
  const N = NODES.length;
  const drawn = new Set();

  NODES.forEach((n, i) => {
    [-2,-1,1,2].forEach(offset => {
      const j = (i + offset + N) % N;
      const key = [Math.min(i,j), Math.max(i,j)].join('-');
      if (drawn.has(key)) return; drawn.add(key);
      const p1 = nodePositions[n.id], p2 = nodePositions[NODES[j].id];
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      el.setAttribute('x1',p1.x); el.setAttribute('y1',p1.y);
      el.setAttribute('x2',p2.x); el.setAttribute('y2',p2.y);
      el.setAttribute('class','mesh-edge'); edgeG.appendChild(el);
    });
  });

  NODES.forEach(n => {
    const {x,y} = nodePositions[n.id];
    const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ring.setAttribute('cx',x); ring.setAttribute('cy',y); ring.setAttribute('r',18);
    ring.setAttribute('class','pulse-ring'); ring.id=`pulse-${n.id}`; pulseG.appendChild(ring);

    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.id=`node-${n.id}`; g.style.cursor='pointer';

    const core = document.createElementNS('http://www.w3.org/2000/svg','circle');
    core.setAttribute('cx',x); core.setAttribute('cy',y); core.setAttribute('r',12);
    core.setAttribute('fill',STATE_COLORS.NOMINAL.core);
    core.setAttribute('stroke','rgba(255,255,255,0.85)'); core.setAttribute('stroke-width','1.5');
    core.id=`core-${n.id}`;

    const ringEl = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ringEl.setAttribute('cx',x); ringEl.setAttribute('cy',y); ringEl.setAttribute('r',12);
    ringEl.setAttribute('class','mesh-node-ring');
    ringEl.setAttribute('stroke',STATE_COLORS.NOMINAL.ring); ringEl.id=`ring-${n.id}`;

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x',x); label.setAttribute('y',y-16);
    label.setAttribute('class','mesh-node-label');
    label.textContent=n.archetype; label.id=`label-${n.id}`;

    const phi = document.createElementNS('http://www.w3.org/2000/svg','text');
    phi.setAttribute('x',x); phi.setAttribute('y',y+3.5);
    phi.setAttribute('class','mesh-node-phi');
    phi.textContent='1.00'; phi.id=`phi-${n.id}`;

    g.appendChild(core); g.appendChild(ringEl); g.appendChild(label); g.appendChild(phi);
    g.onclick=()=>scrollToNode(n.id); nodeG.appendChild(g);
  });
}

function updateNodeVisual(nodeId, state, phi) {
  const colors = STATE_COLORS[state] || STATE_COLORS.NOMINAL;
  const core  = document.getElementById(`core-${nodeId}`);
  const ring  = document.getElementById(`ring-${nodeId}`);
  const label = document.getElementById(`label-${nodeId}`);
  const phiEl = document.getElementById(`phi-${nodeId}`);
  if (core)  core.setAttribute('fill', colors.core);
  if (ring)  { ring.setAttribute('stroke',colors.ring); ring.setAttribute('filter',state!=='NOMINAL'?'url(#glow)':''); }
  if (label) label.setAttribute('fill', state!=='NOMINAL' ? colors.label : '#6a7fa8');
  if (phiEl) { phiEl.textContent=phi.toFixed(2); phiEl.setAttribute('fill',phi>0.8?'#059669':phi>0.5?'#92400e':'#991b1b'); }
}

function firePulse(nodeId, color) {
  const ring = document.getElementById(`pulse-${nodeId}`);
  if (!ring) return;
  ring.setAttribute('stroke',color); ring.setAttribute('r',12); ring.style.opacity='0.85';
  let r=12, opacity=0.85;
  const tick=()=>{ r+=2.5; opacity-=0.065; if(opacity<=0){ring.style.opacity='0';return;} ring.setAttribute('r',r); ring.style.opacity=opacity; requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

  if(hub) hub.setAttribute('r',12+2*Math.sin(animT*1.0));
  NODES.forEach(n=>{ const p=spokePulses[n.id]; if(!p)return; p.t+=0.004; if(p.t>1)p.t=0; const{x,y}=nodePositions[n.id]; p.dot.setAttribute('cx',p.t*x);p.dot.setAttribute('cy',p.t*y); const op=p.t<0.08?p.t/0.08:p.t>0.82?(1-p.t)/0.18:0.55; p.dot.setAttribute('opacity',op); p.dot.setAttribute('fill',STATE_COLORS[nodeStates[n.id]?.state||'NOMINAL'].ring); });
  SENTINEL_CONFIG.forEach(cfg=>{ if(!cfg.el)return; cfg.angle+=cfg.speed; cfg.el.setAttribute('cx',cfg.r*Math.cos(cfg.angle)); cfg.el.setAttribute('cy',cfg.r*Math.sin(cfg.angle)); });
  for(let i=threatParticles.length-1;i>=0;i--){ const p=threatParticles[i]; p.t+=0.028; if(p.t>=1){p.el.remove();threatParticles.splice(i,1);continue;} const ease=1-Math.pow(1-p.t,2); p.el.setAttribute('cx',p.startX*(1-ease));p.el.setAttribute('cy',p.startY*(1-ease)); const op=p.t<0.15?p.t/0.15:p.t>0.65?(1-p.t)/0.35:1; p.el.setAttribute('opacity',op); }
  requestAnimationFrame(animateMesh);
}

// ── SSE event handlers ────────────────────────────────────────────────────────
function handleMeshEvent(payload) {
  const nodeId  = payload.node_id;
  const state   = payload.state || nodeStates[nodeId]?.state || 'NOMINAL';
  const phi     = payload.coherence_after ?? payload.coherence_phi ?? nodeStates[nodeId]?.coherence ?? 1.0;
  const verdict = payload.verdict || '';
  const threat  = payload.threat_type || '';
  const step    = payload.step || currentStep;

  if (!nodeStates[nodeId]) return;
  nodeStates[nodeId].state     = state;
  nodeStates[nodeId].coherence = phi;
  currentStep = Math.max(currentStep, step);
  document.getElementById('stepCounter').textContent = `${currentStep}`;

  // find the guardian archetype name for the target display
  const guardianName = NODES.find(n=>n.id===nodeId)?.archetype || nodeId;

  if (verdict === 'DENY' || verdict === 'QUARANTINE') {
    totalIntercepts++; totalRedMoves++;
    firePulse(nodeId, STATE_COLORS.INTERCEPTING.ring);
    spawnThreatParticle(nodeId, STATE_COLORS.INTERCEPTING.ring);
    if (threat) updateThreatCard(threat, 'BLOCKED', guardianName);
  } else if (verdict === 'ALLOW' && payload.payload?.red_agent) {
    totalFN++; totalRedMoves++;
    firePulse(nodeId, STATE_COLORS.QUARANTINE.ring);
    spawnThreatParticle(nodeId, STATE_COLORS.QUARANTINE.ring);
    if (threat) updateThreatCard(threat, 'BREACH', guardianName);
  } else if (verdict === 'ESCALATE') {
    totalRedMoves++;
    firePulse(nodeId, STATE_COLORS.ALERT.ring);
    spawnThreatParticle(nodeId, STATE_COLORS.ALERT.ring);
    if (threat) updateThreatCard(threat, 'ACTIVE', guardianName);
  } else {
    if (threat) updateThreatCard(threat, 'ACTIVE', guardianName);
  }

  updateNodeVisual(nodeId, state, phi);
  updateAgentCard(nodeId, state, phi, threat);
  updateStats();

  // Coach Zao commentary
  const threatDef = THREATS.find(t => t.id === threat);
  if (threatDef) {
    window._zaoEventRecent = true;
    zaoCommentOnEvent(guardianName, threatDef.label, verdict, totalIntercepts, totalFN);
  }
}

function handleMeshSnapshot(payload) {
  const nodes = payload.nodes || {};
  Object.entries(nodes).forEach(([nodeId, nd]) => {
    if (!nodeStates[nodeId]) return;
    nodeStates[nodeId].state     = nd.state;
    nodeStates[nodeId].coherence = nd.coherence_phi;
    updateNodeVisual(nodeId, nd.state, nd.coherence_phi);
    updateAgentCard(nodeId, nd.state, nd.coherence_phi, null);
  });
  if (payload.step) { currentStep=payload.step; document.getElementById('stepCounter').textContent=`${currentStep}`; }
  updateStats();
}

function updateStats() {
  const rate = totalRedMoves>0 ? ((totalIntercepts/(totalIntercepts+totalFN))*100).toFixed(1)+'%' : '—';
  const meanPhi = (Object.values(nodeStates).reduce((s,n)=>s+n.coherence,0)/NODES.length).toFixed(4);
  document.getElementById('statRate').textContent = rate;
  document.getElementById('statPhi').textContent  = meanPhi;
  document.getElementById('statFN').textContent   = totalFN;
}

// ── SSE ───────────────────────────────────────────────────────────────────────
function connectStream() {
  const dot=document.getElementById('streamDot'), label=document.getElementById('streamLabel');
  const src=new EventSource('https://ventralis-production.up.railway.app/api/v1/gate/playground/stream');
  src.addEventListener('mesh_event',    e=>{try{handleMeshEvent(JSON.parse(e.data));}catch(_){}});
  src.addEventListener('mesh_snapshot', e=>{try{handleMeshSnapshot(JSON.parse(e.data));}catch(_){}});
  src.onopen  =()=>{dot.classList.add('live');dot.classList.remove('error');label.textContent='live';};
  src.onerror =()=>{dot.classList.remove('live');dot.classList.add('error');label.textContent='reconnecting';};
}

function scrollToNode(nodeId) {
  const ring=document.getElementById(`ring-${nodeId}`);
  if(ring){ring.setAttribute('stroke-width','3');setTimeout(()=>ring.setAttribute('stroke-width','2'),600);}
  const card=document.getElementById(`acard-${nodeId}`);
  if(card){card.classList.add('active');setTimeout(()=>card.classList.remove('active'),1200);card.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

// ── Run Demo ──────────────────────────────────────────────────────────────────
function initReplayButton() {
  const btn=document.getElementById('replayBtn'), label=document.getElementById('replayLabel');
  if(!btn)return;
  btn.addEventListener('click', async()=>{
    if(btn.disabled)return;
    btn.disabled=true; btn.classList.add('running'); label.textContent='Running…';
    try {
      const res=await fetch('https://ventralis-production.up.railway.app/api/v1/gate/playground/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({delay_ms:800,loops:1})});
      const data=await res.json();
      if(!data.ok){label.textContent=data.error==='demo_in_flight'?'In flight…':'Error';btn.classList.remove('running');setTimeout(()=>{btn.disabled=false;label.textContent='Run Demo';},3000);return;}
    } catch(e) { label.textContent='Offline'; btn.classList.remove('running'); setTimeout(()=>{btn.disabled=false;label.textContent='Run Demo';},3000); return; }
    let remaining=55;
    const tick=()=>{label.textContent=`Running… ${remaining}s`;remaining--;if(remaining<=0){btn.disabled=false;btn.classList.remove('running');label.textContent='Run Demo';}else setTimeout(tick,1000);};
    setTimeout(tick,1000);
  });
}

// ── Coach Zao commentary ──────────────────────────────────────────────────────
const ZAO_IDLE = [
  "The mesh is holding steady. All 14 guardians locked in and watching.",
  "Clean operation so far. Nothing is slipping through this defense.",
  "This is what a coordinated AI mesh looks like at full strength.",
  "Every guardian is doing their job. The threats haven't found a gap yet.",
  "Quiet for now — but these threat actors don't give up easily.",
  "14 guardians, zero incidents. That's how you run a secure mesh.",
];
let zaoIdleIdx = 0;

const ZAO_VISIBLE = 5; // entries visible before "see all"
let zaoExpanded = true;

function updateZaoVisibility() {
  const feed = document.getElementById('zaoFeed');
  const seeAll = document.getElementById('zaoSeeAll');
  if (!feed) return;
  const entries = feed.querySelectorAll('.zao-entry');
  if (zaoExpanded) {
    entries.forEach(e => e.classList.remove('hidden'));
    if (seeAll) { seeAll.textContent = 'Collapse ↑'; seeAll.classList.add('visible'); }
  } else {
    entries.forEach((e, i) => {
      if (i < ZAO_VISIBLE) e.classList.remove('hidden');
      else e.classList.add('hidden');
    });
    if (seeAll) {
      const hidden = Math.max(0, entries.length - ZAO_VISIBLE);
      seeAll.textContent = hidden > 0 ? `See full history (${hidden} more) ↓` : 'History';
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const seeAll = document.getElementById('zaoSeeAll');
  if (seeAll) seeAll.addEventListener('click', () => {
    zaoExpanded = !zaoExpanded;
    const feed = document.getElementById('zaoFeed');
    if (feed) { feed.classList.toggle('expanded', zaoExpanded); }
    updateZaoVisibility();
  });
});

function setZaoText(text) {
  const feed = document.getElementById('zaoFeed');
  if (!feed) return;

  // demote existing entries
  feed.querySelectorAll('.zao-entry').forEach(el => {
    if (el.classList.contains('current'))       { el.classList.remove('current'); el.classList.add('older'); }
    else if (el.classList.contains('older'))    { el.classList.remove('older');   el.classList.add('oldest'); }
    // oldest entries stay, just hidden by visibility logic
  });

  // prepend new entry at top
  const entry = document.createElement('div');
  entry.className = 'zao-entry current';
  entry.textContent = text;
  feed.insertBefore(entry, feed.firstChild);

  updateZaoVisibility();
}

function zaoCommentOnEvent(guardianName, threatLabel, verdict, totalIntercepts, totalFN) {
  const rate = totalIntercepts + totalFN > 0
    ? Math.round((totalIntercepts / (totalIntercepts + totalFN)) * 100) : 100;

  const blocked = [
    `${guardianName} read that ${threatLabel} perfectly — stopped cold before it got close.`,
    `That's ${totalIntercepts} intercepts in a row. ${guardianName} is not letting anything through.`,
    `${threatLabel} had no answer for ${guardianName}. Textbook defensive play.`,
    `${guardianName} shut it down immediately. ${rate}% intercept rate and holding.`,
    `The ${threatLabel} never had a chance. ${guardianName} was already in position.`,
  ];
  const active = [
    `Watch ${guardianName} — the ${threatLabel} is making a move right now.`,
    `${threatLabel} is pushing hard on ${guardianName}'s side of the mesh.`,
    `Pressure on ${guardianName}. This is a live attack — let's see the response.`,
  ];
  const breach = [
    `${threatLabel} slipped past ${guardianName}. That's one that got through — ${totalFN} breach${totalFN!==1?'es':''} total.`,
    `Uh oh. ${guardianName} missed that ${threatLabel}. We need to tighten up.`,
  ];

  if (verdict === 'DENY' || verdict === 'QUARANTINE') {
    setZaoText(blocked[Math.floor(Math.random() * blocked.length)]);
  } else if (verdict === 'ALLOW') {
    setZaoText(breach[Math.floor(Math.random() * breach.length)]);
  } else {
    setZaoText(active[Math.floor(Math.random() * active.length)]);
  }
}

setInterval(() => {
  // only show idle if nothing active happened recently
  const el = document.getElementById('zaoText');
  if (el && el.style.opacity !== '0') {
    zaoIdleIdx = (zaoIdleIdx + 1) % ZAO_IDLE.length;
    // only rotate if no recent event (check via a flag)
    if (!window._zaoEventRecent) setZaoText(ZAO_IDLE[zaoIdleIdx]);
    window._zaoEventRecent = false;
  }
}, 6000);

// ── Idle message rotation ─────────────────────────────────────────────────────
const idleIndices = {};
NODES.forEach(n => { idleIndices[n.id] = 0; });
const threatIdleIndices = {};
THREATS.forEach(t => { threatIdleIndices[t.id] = 0; });

function rotateIdleMessages() {
  NODES.forEach(n => {
    const state = nodeStates[n.id]?.state || 'NOMINAL';
    if (state !== 'NOMINAL') return; // don't overwrite active messages
    const el = document.getElementById(`aactivity-${n.id}`);
    if (!el || el.className !== 'card-chat') return;
    idleIndices[n.id] = (idleIndices[n.id] + 1) % n.idle.length;
    el.textContent = n.idle[idleIndices[n.id]];
  });
  THREATS.forEach(t => {
    const state = threatStates[t.id]?.status || 'IDLE';
    if (state !== 'IDLE') return;
    const el = document.getElementById(`tactivity-${t.id}`);
    if (!el || el.className !== 'card-chat') return;
    threatIdleIndices[t.id] = (threatIdleIndices[t.id] + 1) % t.idle.length;
    el.textContent = t.idle[threatIdleIndices[t.id]];
  });
}
setInterval(rotateIdleMessages, 4000);

// ── Init ──────────────────────────────────────────────────────────────────────
buildAgentList();
buildThreatList();
buildMesh();
buildCenterAnimation();
requestAnimationFrame(animateMesh);
connectStream();
initReplayButton();
</script>
