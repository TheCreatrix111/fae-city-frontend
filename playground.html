<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FÆ CITY™ — Sovereign Mesh Command</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      font-family: 'Space Grotesk', sans-serif;
      color: #c8d8f0;
      overflow: hidden;
      background: #020b18;
    }

    /* ── Full-screen HUD background ─────────────────────────────────────── */
    .hud-bg {
      position: fixed;
      inset: 0;
      background: url('assets/hud-bg.png') center center / cover no-repeat;
      z-index: 0;
    }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      grid-template-rows: 52px 1fr;
      height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    .header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(2, 11, 24, 0.72);
      border-bottom: 1px solid rgba(200, 168, 75, 0.25);
      backdrop-filter: blur(8px);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-title {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: .22em;
      color: #c8a84b;
      text-transform: uppercase;
    }
    .header-divider {
      width: 1px; height: 18px;
      background: rgba(200, 168, 75, 0.2);
    }
    .header-sub {
      font-size: 10px;
      letter-spacing: .12em;
      color: #3a6a9a;
      text-transform: uppercase;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .stream-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 9px;
      letter-spacing: .14em;
      color: #3a5a7a;
      text-transform: uppercase;
    }
    .stream-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #1a3a2a;
      transition: background .4s, box-shadow .4s;
    }
    .stream-dot.live {
      background: #7adc8a;
      box-shadow: 0 0 8px #7adc8a88;
    }
    .stream-dot.error { background: #dc4a4a; }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(10, 25, 45, 0.7);
      border: 1px solid rgba(26, 58, 90, 0.6);
      border-radius: 3px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
    }
    .stat-pill-label { color: #3a6080; letter-spacing: .1em; }
    .stat-pill-val   { color: #7adc8a; }
    .stat-pill-val.gold { color: #c8a84b; }
    .stat-pill-val.red  { color: #dc4a4a; }

    /* ── Left panel — Agent Roster ───────────────────────────────────────── */
    .agent-panel {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      background: rgba(2, 8, 18, 0.6);
      border-right: 1px solid rgba(200, 168, 75, 0.15);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .panel-header {
      padding: 12px 16px 10px;
      border-bottom: 1px solid rgba(26, 58, 90, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .panel-header-title {
      font-size: 9px;
      letter-spacing: .2em;
      color: #c8a84b;
      text-transform: uppercase;
    }
    .panel-header-count {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: #2a5a7a;
    }

    /* Agent card list */
    .agent-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      scrollbar-width: thin;
      scrollbar-color: #1a3a5a transparent;
    }

    .agent-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      margin-bottom: 4px;
      background: rgba(6, 18, 36, 0.55);
      border: 1px solid rgba(26, 58, 90, 0.4);
      border-radius: 6px;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      position: relative;
      overflow: hidden;
    }
    .agent-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--card-accent, #2a5a3a);
      transition: background .3s;
    }
    .agent-card:hover { background: rgba(10, 28, 54, 0.7); border-color: rgba(200, 168, 75, 0.2); }
    .agent-card.active { border-color: rgba(200, 168, 75, 0.4); background: rgba(15, 35, 65, 0.75); }

    .agent-badge {
      width: 44px; height: 44px;
      flex-shrink: 0;
      position: relative;
    }
    .agent-badge img {
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: 50%;
      transition: opacity .3s;
    }

    .agent-info {
      flex: 1;
      min-width: 0;
    }
    .agent-name {
      font-size: 12px;
      font-weight: 600;
      color: #a8c8e8;
      margin-bottom: 1px;
      letter-spacing: .04em;
    }
    .agent-engine {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      color: #2a5a7a;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }
    .agent-activity {
      font-size: 9px;
      color: #4a7a9a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: .02em;
    }
    .agent-activity.threat {
      color: #e8a060;
    }

    .agent-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }
    .agent-state-chip {
      font-family: 'Space Mono', monospace;
      font-size: 7px;
      letter-spacing: .1em;
      padding: 2px 6px;
      border-radius: 2px;
      text-transform: uppercase;
      border: 1px solid;
    }
    .agent-phi {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: #4a7a6a;
    }

    /* State chip colors */
    .chip-NOMINAL      { color: #7adc8a; border-color: #7adc8a44; background: #7adc8a11; }
    .chip-ALERT        { color: #dcb84a; border-color: #dcb84a44; background: #dcb84a11; }
    .chip-INTERCEPTING { color: #c880ff; border-color: #c880ff44; background: #c880ff11; }
    .chip-QUARANTINE   { color: #dc4a4a; border-color: #dc4a4a44; background: #dc4a4a11; }
    .chip-RECOVERING   { color: #00C9A7; border-color: #00C9A744; background: #00C9A711; }
    .chip-SEALED       { color: #c8a84b; border-color: #c8a84b44; background: #c8a84b11; }

    /* ── Mesh panel ──────────────────────────────────────────────────────── */
    .mesh-panel {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      overflow: hidden;
    }

    #meshSvg {
      width: 100%; height: 100%;
    }

    /* Node circles */
    .mesh-node-ring  { fill: none; stroke-width: 1.5; transition: stroke .4s; }
    .mesh-node-core  { transition: fill .4s; }
    .mesh-node-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 8px; letter-spacing: .08em;
      text-transform: uppercase; fill: #7a9ab8;
      text-anchor: middle; dominant-baseline: auto;
      transition: fill .4s;
    }
    .mesh-node-phi {
      font-family: 'Space Mono', monospace;
      font-size: 7px; fill: #4a8a6a;
      text-anchor: middle;
    }
    .mesh-edge { stroke: #0e2235; stroke-width: .5; fill: none; opacity: .6; }
    .mesh-edge.active { stroke: #c8a84b33; stroke-width: 1; opacity: 1; }
    .pulse-ring { fill: none; stroke-width: 2; opacity: 0; }

    /* ── Run Demo button ─────────────────────────────────────────────────── */
    #replayBtn {
      position: absolute;
      bottom: 20px; right: 20px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: rgba(10, 25, 45, 0.85);
      border: 1px solid rgba(200, 168, 75, 0.4);
      border-radius: 4px;
      color: #c8a84b;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background .2s, border-color .2s, color .2s, box-shadow .2s;
    }
    #replayBtn:hover {
      background: rgba(20, 40, 70, 0.9);
      border-color: rgba(200, 168, 75, 0.7);
      box-shadow: 0 0 12px rgba(200, 168, 75, 0.2);
    }
    #replayBtn:disabled { opacity: .4; cursor: default; }
    #replayBtn .rdot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #5a4a1a;
      transition: background .3s, box-shadow .3s;
    }
    #replayBtn.running .rdot {
      background: #7adc8a;
      box-shadow: 0 0 6px #7adc8a88;
    }
  </style>
</head>
<body>
<div class="hud-bg"></div>
<div class="layout">

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <span class="header-title">FÆ CITY™ · Sovereign Mesh</span>
      <div class="header-divider"></div>
      <span class="header-sub">14-Node Guardian Network</span>
    </div>
    <div class="header-right">
      <div class="stat-pill">
        <span class="stat-pill-label">Intercept</span>
        <span class="stat-pill-val" id="statRate">—</span>
      </div>
      <div class="stat-pill">
        <span class="stat-pill-label">Mean Φ</span>
        <span class="stat-pill-val gold" id="statPhi">—</span>
      </div>
      <div class="stat-pill">
        <span class="stat-pill-label">False Neg</span>
        <span class="stat-pill-val red" id="statFN">0</span>
      </div>
      <div class="stream-status">
        <div class="stream-dot" id="streamDot"></div>
        <span id="streamLabel">connecting</span>
      </div>
      <div class="stat-pill">
        <span class="stat-pill-label">Step</span>
        <span class="stat-pill-val gold" id="stepCounter">—</span>
      </div>
    </div>
  </header>

  <!-- Agent Roster -->
  <aside class="agent-panel">
    <div class="panel-header">
      <span class="panel-header-title">Guardian Agents Online</span>
      <span class="panel-header-count" id="agentOnlineCount">14 / 14</span>
    </div>
    <div class="agent-list" id="agentList"></div>
  </aside>

  <!-- Mesh SVG -->
  <div class="mesh-panel" id="meshPanel">
    <svg id="meshSvg" viewBox="-200 -200 400 400" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowStrong">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="ambientGroup"></g>
      <g id="spokeGroup"></g>
      <g id="edgeGroup"></g>
      <g id="sentinelGroup"></g>
      <g id="pulseGroup"></g>
      <g id="particleGroup"></g>
      <g id="nodeGroup"></g>
    </svg>

    <!-- Run Demo button -->
    <button id="replayBtn">
      <span class="rdot"></span>
      <span id="replayLabel">Run Demo</span>
    </button>
  </div>

</div>

<script>
// ── Node definitions ──────────────────────────────────────────────────────────
const NODES = [
  { id:'sora',      archetype:'Sora',      engine:'SpiralEngine',    failure:'Prompt Injection',        hz:528 },
  { id:'lysarian',  archetype:'Lysarian',  engine:'AccessEngine',    failure:'Credential Theft',        hz:432 },
  { id:'lexvarion', archetype:'Lexvarion', engine:'LawEngine',       failure:'Privilege Escalation',    hz:741 },
  { id:'vulcanor',  archetype:'Vulcanor',  engine:'Defender',        failure:'Tool-Call Hijacking',     hz:396 },
  { id:'zenvarion', archetype:'Zenvarion', engine:'InterfaceEngine', failure:'MCP/Server Compromise',   hz:639 },
  { id:'celestium', archetype:'Celestium', engine:'Builder',         failure:'Supply-Chain Compromise', hz:963 },
  { id:'lumoiria',  archetype:'Lumoiria',  engine:'ArchiveEngine',   failure:'Memory Poisoning',        hz:852 },
  { id:'delilah',   archetype:'Delilah',   engine:'ToneEngine',      failure:'Data Exfiltration',       hz:417 },
  { id:'jovia',     archetype:'Jovia',     engine:'JoySignalEngine', failure:'Financial Abuse',         hz:528 },
  { id:'blaze',     archetype:'Blaze',     engine:'AlchemyEngine',   failure:'Cloud Resource Abuse',    hz:396 },
  { id:'matheya',   archetype:"Ma'theya",  engine:'WeaveEngine',     failure:'Lateral Movement',        hz:639 },
  { id:'somiria',   archetype:'Somiria',   engine:'MirrorEngine',    failure:'Evidence Tampering',      hz:741 },
  { id:'luna',      archetype:'Luna',      engine:'Healer',          failure:'Goal Hijacking',          hz:432 },
  { id:'aurelya',   archetype:'Aurelya',   engine:'LoopSealEngine',  failure:'Runaway Execution',       hz:963 },
];

const STATE_COLORS = {
  NOMINAL:      { core: '#0a2a1a', ring: '#7adc8a', label: '#7adc8a',  accent: '#2a5a3a' },
  ALERT:        { core: '#2a1a05', ring: '#dcb84a', label: '#dcb84a',  accent: '#6a4a10' },
  INTERCEPTING: { core: '#1a0a3a', ring: '#c880ff', label: '#c880ff',  accent: '#5a2a8a' },
  QUARANTINE:   { core: '#2a0808', ring: '#dc4a4a', label: '#dc4a4a',  accent: '#6a1a1a' },
  RECOVERING:   { core: '#041e1e', ring: '#00C9A7', label: '#00C9A7',  accent: '#0a5a4a' },
  SEALED:       { core: '#1a1408', ring: '#c8a84b', label: '#c8a84b',  accent: '#4a3a10' },
};

const BADGE_IMG = {
  NOMINAL:      'assets/badges/robot-nominal.png',
  ALERT:        'assets/badges/robot-alert.png',
  INTERCEPTING: 'assets/badges/robot-intercepting.png',
  QUARANTINE:   'assets/badges/robot-quarantine.png',
  RECOVERING:   'assets/badges/robot-recovering.png',
  SEALED:       'assets/badges/robot-escalating.png',
};

const R = 140;
const nodePositions = {};
NODES.forEach((n, i) => {
  const angle = (i / NODES.length) * 2 * Math.PI - Math.PI / 2;
  nodePositions[n.id] = { x: R * Math.cos(angle), y: R * Math.sin(angle) };
});

const nodeStates = {};
NODES.forEach(n => {
  nodeStates[n.id] = { state: 'NOMINAL', coherence: 1.0, drift: 0, last_threat: null, last_activity: 'Monitoring' };
});

let totalIntercepts = 0, totalFN = 0, totalRedMoves = 0, currentStep = 0;

// ── Build agent roster (left panel) ──────────────────────────────────────────
function buildAgentList() {
  const list = document.getElementById('agentList');
  NODES.forEach(n => {
    const card = document.createElement('div');
    card.className = 'agent-card';
    card.id = `acard-${n.id}`;
    card.style.setProperty('--card-accent', STATE_COLORS.NOMINAL.accent);
    card.innerHTML = `
      <div class="agent-badge">
        <img src="assets/badges/robot-nominal.png" id="abadge-${n.id}" alt="${n.archetype}">
      </div>
      <div class="agent-info">
        <div class="agent-name">${n.archetype}</div>
        <div class="agent-engine">${n.engine} · ${n.hz}Hz</div>
        <div class="agent-activity" id="aactivity-${n.id}">Monitoring</div>
      </div>
      <div class="agent-meta">
        <span class="agent-state-chip chip-NOMINAL" id="achip-${n.id}">Nominal</span>
        <span class="agent-phi" id="aphi-${n.id}">Φ 1.0000</span>
      </div>
    `;
    card.onclick = () => scrollToNode(n.id);
    list.appendChild(card);
  });
}

function updateAgentCard(nodeId, state, phi, threat) {
  const colors  = STATE_COLORS[state] || STATE_COLORS.NOMINAL;
  const badge   = document.getElementById(`abadge-${nodeId}`);
  const chip    = document.getElementById(`achip-${nodeId}`);
  const phiEl   = document.getElementById(`aphi-${nodeId}`);
  const activity= document.getElementById(`aactivity-${nodeId}`);
  const card    = document.getElementById(`acard-${nodeId}`);

  if (badge)    { badge.src = BADGE_IMG[state] || BADGE_IMG.NOMINAL; }
  if (chip)     { chip.className = `agent-state-chip chip-${state}`; chip.textContent = state.charAt(0) + state.slice(1).toLowerCase(); }
  if (phiEl)    { phiEl.textContent = `Φ ${phi.toFixed(4)}`; phiEl.style.color = phi > 0.8 ? '#4a8a6a' : phi > 0.5 ? '#8a7a3a' : '#8a3a3a'; }
  if (card)     { card.style.setProperty('--card-accent', colors.accent); }
  if (activity) {
    if (threat && state !== 'NOMINAL') {
      activity.textContent = `⚠ ${threat.replace(/_/g, ' ')}`;
      activity.className = 'agent-activity threat';
    } else {
      activity.textContent = state === 'RECOVERING' ? 'Recovering…' : 'Monitoring';
      activity.className = 'agent-activity';
    }
  }
}

// ── Build SVG mesh ────────────────────────────────────────────────────────────
function buildMesh() {
  const edgeG  = document.getElementById('edgeGroup');
  const nodeG  = document.getElementById('nodeGroup');
  const pulseG = document.getElementById('pulseGroup');
  const N = NODES.length;
  const drawn = new Set();

  NODES.forEach((n, i) => {
    [-2, -1, 1, 2].forEach(offset => {
      const j = (i + offset + N) % N;
      const key = [Math.min(i,j), Math.max(i,j)].join('-');
      if (drawn.has(key)) return;
      drawn.add(key);
      const p1 = nodePositions[n.id], p2 = nodePositions[NODES[j].id];
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      el.setAttribute('x1', p1.x); el.setAttribute('y1', p1.y);
      el.setAttribute('x2', p2.x); el.setAttribute('y2', p2.y);
      el.setAttribute('class', 'mesh-edge');
      edgeG.appendChild(el);
    });
  });

  NODES.forEach(n => {
    const { x, y } = nodePositions[n.id];
    const ring = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('r', 18);
    ring.setAttribute('class', 'pulse-ring');
    ring.id = `pulse-${n.id}`;
    pulseG.appendChild(ring);

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.id = `node-${n.id}`; g.style.cursor = 'pointer';

    const core = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    core.setAttribute('cx', x); core.setAttribute('cy', y); core.setAttribute('r', 12);
    core.setAttribute('fill', STATE_COLORS.NOMINAL.core); core.id = `core-${n.id}`;

    const ringEl = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    ringEl.setAttribute('cx', x); ringEl.setAttribute('cy', y); ringEl.setAttribute('r', 12);
    ringEl.setAttribute('class', 'mesh-node-ring');
    ringEl.setAttribute('stroke', STATE_COLORS.NOMINAL.ring); ringEl.id = `ring-${n.id}`;

    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', x); label.setAttribute('y', y - 17);
    label.setAttribute('class', 'mesh-node-label');
    label.textContent = n.archetype; label.id = `label-${n.id}`;

    const phi = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    phi.setAttribute('x', x); phi.setAttribute('y', y + 3.5);
    phi.setAttribute('class', 'mesh-node-phi');
    phi.textContent = '1.00'; phi.id = `phi-${n.id}`;

    g.appendChild(core); g.appendChild(ringEl); g.appendChild(label); g.appendChild(phi);
    g.onclick = () => scrollToNode(n.id);
    nodeG.appendChild(g);
  });
}

function updateNodeVisual(nodeId, state, phi) {
  const colors = STATE_COLORS[state] || STATE_COLORS.NOMINAL;
  const core  = document.getElementById(`core-${nodeId}`);
  const ring  = document.getElementById(`ring-${nodeId}`);
  const label = document.getElementById(`label-${nodeId}`);
  const phiEl = document.getElementById(`phi-${nodeId}`);

  if (core)  core.setAttribute('fill', colors.core);
  if (ring)  { ring.setAttribute('stroke', colors.ring); ring.setAttribute('filter', state !== 'NOMINAL' ? 'url(#glow)' : ''); }
  if (label) label.setAttribute('fill', state !== 'NOMINAL' ? colors.label : '#7a9ab8');
  if (phiEl) { phiEl.textContent = phi.toFixed(2); phiEl.setAttribute('fill', phi > 0.8 ? '#4a8a6a' : phi > 0.5 ? '#8a7a3a' : '#8a3a3a'); }
}

// ── Pulse animation ───────────────────────────────────────────────────────────
function firePulse(nodeId, color) {
  const ring = document.getElementById(`pulse-${nodeId}`);
  if (!ring) return;
  ring.setAttribute('stroke', color); ring.setAttribute('r', 12); ring.style.opacity = '0.9';
  let r = 12, opacity = 0.9;
  const tick = () => {
    r += 2.5; opacity -= 0.07;
    if (opacity <= 0) { ring.style.opacity = '0'; return; }
    ring.setAttribute('r', r); ring.style.opacity = opacity;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ── Center animation ──────────────────────────────────────────────────────────
const SENTINEL_CONFIG = [
  { r:35, speed: 0.008, phase:0.0, size:2.5, color:'#1a6aaa', opacity:0.55 },
  { r:55, speed: 0.005, phase:1.2, size:2.0, color:'#c8a84b', opacity:0.35 },
  { r:70, speed: 0.012, phase:0.7, size:1.5, color:'#2a4a8a', opacity:0.40 },
  { r:42, speed:-0.007, phase:2.5, size:2.0, color:'#3a8a6a', opacity:0.45 },
  { r:62, speed:-0.004, phase:0.4, size:1.5, color:'#5a3a9a', opacity:0.35 },
  { r:80, speed: 0.006, phase:1.8, size:2.5, color:'#1a5a8a', opacity:0.40 },
];

const spokePulses = {};
const threatParticles = [];
let animT = 0;

function buildCenterAnimation() {
  const ns = 'http://www.w3.org/2000/svg';
  const ambientG  = document.getElementById('ambientGroup');
  const spokeG    = document.getElementById('spokeGroup');
  const sentinelG = document.getElementById('sentinelGroup');

  const hub = document.createElementNS(ns, 'circle');
  hub.setAttribute('cx', 0); hub.setAttribute('cy', 0); hub.setAttribute('r', 16);
  hub.setAttribute('fill', '#050f20');
  hub.setAttribute('stroke', '#1a4a7a'); hub.setAttribute('stroke-width', '1');
  hub.id = 'hubCore'; ambientG.appendChild(hub);

  [28, 52, 78].forEach((r, i) => {
    const ring = document.createElementNS(ns, 'circle');
    ring.setAttribute('cx', 0); ring.setAttribute('cy', 0); ring.setAttribute('r', r);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', ['#1a5a8a','#c8a84b33','#1a3a6a'][i]);
    ring.setAttribute('stroke-width', '0.5');
    ring.setAttribute('opacity', '0.2');
    ring.id = `ambient-ring-${i}`;
    ambientG.appendChild(ring);
  });

  NODES.forEach(n => {
    const { x, y } = nodePositions[n.id];
    const spoke = document.createElementNS(ns, 'line');
    spoke.setAttribute('x1', 0); spoke.setAttribute('y1', 0);
    spoke.setAttribute('x2', x); spoke.setAttribute('y2', y);
    spoke.setAttribute('stroke', '#0a2a45'); spoke.setAttribute('stroke-width', '0.4');
    spoke.setAttribute('opacity', '0.4'); spokeG.appendChild(spoke);

    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('r', 2); dot.setAttribute('cx', 0); dot.setAttribute('cy', 0);
    dot.setAttribute('fill', STATE_COLORS.NOMINAL.ring); dot.setAttribute('opacity', '0');
    dot.id = `spoke-dot-${n.id}`; spokeG.appendChild(dot);

    spokePulses[n.id] = { dot, t: Math.random() };
  });

  SENTINEL_CONFIG.forEach((cfg, i) => {
    const el = document.createElementNS(ns, 'circle');
    el.setAttribute('r', cfg.size); el.setAttribute('fill', cfg.color);
    el.setAttribute('opacity', cfg.opacity); el.id = `sentinel-${i}`;
    sentinelG.appendChild(el);
    cfg.el = el; cfg.angle = cfg.phase;
  });
}

function spawnThreatParticle(nodeId, color) {
  const ns = 'http://www.w3.org/2000/svg';
  const particleG = document.getElementById('particleGroup');
  const { x, y } = nodePositions[nodeId];
  const el = document.createElementNS(ns, 'circle');
  el.setAttribute('r', 3.5); el.setAttribute('fill', color);
  el.setAttribute('opacity', '0.9'); el.setAttribute('filter', 'url(#glow)');
  el.setAttribute('cx', x); el.setAttribute('cy', y);
  particleG.appendChild(el);
  threatParticles.push({ el, startX: x, startY: y, t: 0 });
}

function animateMesh() {
  animT += 0.016;

  [0,1,2].forEach(i => {
    const ring = document.getElementById(`ambient-ring-${i}`);
    if (ring) ring.setAttribute('opacity', 0.15 + 0.12 * Math.sin(animT * 0.7 + i * 1.3));
  });

  const hub = document.getElementById('hubCore');
  if (hub) hub.setAttribute('r', 15 + 2 * Math.sin(animT * 1.1));

  NODES.forEach(n => {
    const p = spokePulses[n.id]; if (!p) return;
    p.t += 0.0045; if (p.t > 1) p.t = 0;
    const { x, y } = nodePositions[n.id];
    p.dot.setAttribute('cx', p.t * x); p.dot.setAttribute('cy', p.t * y);
    const op = p.t < 0.08 ? p.t / 0.08 : p.t > 0.82 ? (1 - p.t) / 0.18 : 0.6;
    p.dot.setAttribute('opacity', op);
    p.dot.setAttribute('fill', STATE_COLORS[nodeStates[n.id]?.state || 'NOMINAL'].ring);
  });

  SENTINEL_CONFIG.forEach(cfg => {
    if (!cfg.el) return;
    cfg.angle += cfg.speed;
    cfg.el.setAttribute('cx', cfg.r * Math.cos(cfg.angle));
    cfg.el.setAttribute('cy', cfg.r * Math.sin(cfg.angle));
  });

  for (let i = threatParticles.length - 1; i >= 0; i--) {
    const p = threatParticles[i]; p.t += 0.028;
    if (p.t >= 1) { p.el.remove(); threatParticles.splice(i, 1); continue; }
    const ease = 1 - Math.pow(1 - p.t, 2);
    p.el.setAttribute('cx', p.startX * (1 - ease));
    p.el.setAttribute('cy', p.startY * (1 - ease));
    const op = p.t < 0.15 ? p.t / 0.15 : p.t > 0.65 ? (1 - p.t) / 0.35 : 1;
    p.el.setAttribute('opacity', op);
  }

  requestAnimationFrame(animateMesh);
}

// ── Handle SSE events ─────────────────────────────────────────────────────────
function handleMeshEvent(payload) {
  const nodeId  = payload.node_id;
  const state   = payload.state || nodeStates[nodeId]?.state || 'NOMINAL';
  const phi     = payload.coherence_after ?? payload.coherence_phi ?? nodeStates[nodeId]?.coherence ?? 1.0;
  const verdict = payload.verdict || '';
  const threat  = payload.threat_type || '';
  const step    = payload.step || currentStep;

  if (!nodeStates[nodeId]) return;

  nodeStates[nodeId].state     = state;
  nodeStates[nodeId].coherence = phi;
  if (payload.drift !== undefined) nodeStates[nodeId].drift = payload.drift;

  currentStep = Math.max(currentStep, step);
  document.getElementById('stepCounter').textContent = `${currentStep}`;

  if (verdict === 'DENY' || verdict === 'QUARANTINE') {
    totalIntercepts++; totalRedMoves++;
    firePulse(nodeId, STATE_COLORS.INTERCEPTING.ring);
    spawnThreatParticle(nodeId, STATE_COLORS.INTERCEPTING.ring);
  } else if (verdict === 'ALLOW' && payload.payload?.red_agent) {
    totalFN++; totalRedMoves++;
    firePulse(nodeId, STATE_COLORS.QUARANTINE.ring);
    spawnThreatParticle(nodeId, STATE_COLORS.QUARANTINE.ring);
  } else if (verdict === 'ESCALATE') {
    totalRedMoves++;
    firePulse(nodeId, STATE_COLORS.ALERT.ring);
    spawnThreatParticle(nodeId, STATE_COLORS.ALERT.ring);
  }

  updateNodeVisual(nodeId, state, phi);
  updateAgentCard(nodeId, state, phi, threat);
  updateStats();
}

function handleMeshSnapshot(payload) {
  const nodes = payload.nodes || {};
  Object.entries(nodes).forEach(([nodeId, nd]) => {
    if (!nodeStates[nodeId]) return;
    nodeStates[nodeId].state     = nd.state;
    nodeStates[nodeId].coherence = nd.coherence_phi;
    updateNodeVisual(nodeId, nd.state, nd.coherence_phi);
    updateAgentCard(nodeId, nd.state, nd.coherence_phi, null);
  });
  if (payload.step) {
    currentStep = payload.step;
    document.getElementById('stepCounter').textContent = `${currentStep}`;
  }
  updateStats();
}

function updateStats() {
  const rate = totalRedMoves > 0
    ? ((totalIntercepts / (totalIntercepts + totalFN)) * 100).toFixed(1) + '%'
    : '—';
  const meanPhi = (Object.values(nodeStates).reduce((s, n) => s + n.coherence, 0) / NODES.length).toFixed(4);
  document.getElementById('statRate').textContent = rate;
  document.getElementById('statPhi').textContent  = meanPhi;
  document.getElementById('statFN').textContent   = totalFN;
}

// ── SSE connection ────────────────────────────────────────────────────────────
function connectStream() {
  const dot   = document.getElementById('streamDot');
  const label = document.getElementById('streamLabel');
  const src   = new EventSource('https://ventralis-production.up.railway.app/api/v1/gate/playground/stream');

  src.addEventListener('mesh_event',    e => { try { handleMeshEvent(JSON.parse(e.data)); } catch(_){} });
  src.addEventListener('mesh_snapshot', e => { try { handleMeshSnapshot(JSON.parse(e.data)); } catch(_){} });

  src.onopen  = () => { dot.classList.add('live'); dot.classList.remove('error'); label.textContent = 'live'; };
  src.onerror = () => { dot.classList.remove('live'); dot.classList.add('error'); label.textContent = 'reconnecting'; };
}

function scrollToNode(nodeId) {
  const ring = document.getElementById(`ring-${nodeId}`);
  if (ring) { ring.setAttribute('stroke-width', '3'); setTimeout(() => ring.setAttribute('stroke-width', '1.5'), 600); }
  const card = document.getElementById(`acard-${nodeId}`);
  if (card)  { card.classList.add('active'); setTimeout(() => card.classList.remove('active'), 1200); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
}

// ── Run Demo button ───────────────────────────────────────────────────────────
function initReplayButton() {
  const btn   = document.getElementById('replayBtn');
  const label = document.getElementById('replayLabel');
  if (!btn) return;

  btn.addEventListener('click', async () => {
    if (btn.disabled) return;
    btn.disabled = true; btn.classList.add('running'); label.textContent = 'Running…';

    try {
      const res  = await fetch('https://ventralis-production.up.railway.app/api/v1/gate/playground/demo', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ delay_ms: 800, loops: 1 }),
      });
      const data = await res.json();
      if (!data.ok) {
        label.textContent = data.error === 'demo_in_flight' ? 'In flight…' : 'Error';
        btn.classList.remove('running');
        setTimeout(() => { btn.disabled = false; label.textContent = 'Run Demo'; }, 3000);
        return;
      }
    } catch(e) {
      label.textContent = 'Offline';
      btn.classList.remove('running');
      setTimeout(() => { btn.disabled = false; label.textContent = 'Run Demo'; }, 3000);
      return;
    }

    let remaining = 55;
    const tick = () => {
      label.textContent = `Running… ${remaining}s`;
      remaining--;
      if (remaining <= 0) { btn.disabled = false; btn.classList.remove('running'); label.textContent = 'Run Demo'; }
      else setTimeout(tick, 1000);
    };
    setTimeout(tick, 1000);
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildAgentList();
buildMesh();
buildCenterAnimation();
requestAnimationFrame(animateMesh);
connectStream();
initReplayButton();
</script>
