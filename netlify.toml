[build]
  publish = "."

# ── Proxy API routes to Railway ────────────────────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "https://ventralis-production.up.railway.app/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/auth/*"
  to     = "https://ventralis-production.up.railway.app/auth/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/waitlist/join"
  to     = "https://ventralis-production.up.railway.app/waitlist/join"
  status = 200
  force  = true

[[redirects]]
  from   = "/waitlist/count"
  to     = "https://ventralis-production.up.railway.app/waitlist/count"
  status = 200
  force  = true

[[redirects]]
  from   = "/waitlist/export"
  to     = "https://ventralis-production.up.railway.app/waitlist/export"
  status = 200
  force  = true

# ── Page routes ────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/"
  to     = "/waitlist.html"
  status = 200

[[redirects]]
  from   = "/waitlist"
  to     = "/waitlist.html"
  status = 200

[[redirects]]
  from   = "/signin"
  to     = "/signin.html"
  status = 200

[[redirects]]
  from   = "/house"
  to     = "/ventralis_house.html"
  status = 200

[[redirects]]
  from   = "/departure"
  to     = "/departure.html"
  status = 200

# ── Security headers ───────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-XSS-Protection        = "1; mode=block"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/api/v1/gate/ingress"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma        = "no-cache"

[[headers]]
  for = "/OneSignalSDKWorker.js"
  [headers.values]
    Content-Type          = "application/javascript"
    Service-Worker-Allowed = "/"
    Cache-Control         = "no-cache"
